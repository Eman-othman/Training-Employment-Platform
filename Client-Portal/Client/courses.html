        let list = document.querySelectorAll('.list');
        for (let i = 0; i < list.length; i++) {

                let j = 0;
                while (j < list.length) {
                    list[j++].className = 'list'
                }
                list[i].className = 'list active'
            }
        }

    <script src="sweetalert.min.js"></script>
    <script>
        let currentVideoIndex = 0;

        function confirmCancellation(form) {
            swal({
                title: "Are you sure?",
                text: "Registration for this course will be cancelled.",
                icon: "warning",
                buttons: true,
                dangerMode: true,
            }).then((confirmed) => {
                if (confirmed) form.submit();
            });
            return false;
        }

        function playCourseVideo(src, button, index) {
            const player = document.getElementById('coursePlayer');
            const allLis = document.querySelectorAll('.course-videos li');
            const parentLi = button.closest('li');

            if (parentLi.classList.contains('locked')) {
                alert("Please watch the previous video first.");
                return;
            }

            player.src = src;
            player.style.display = 'block';
            player.load();
            player.play().catch(err => {
                console.error("Playback failed:", err);
            });

            let lastTime = 0;
            player.ontimeupdate = () => {
                if (player.currentTime > lastTime + 1) {
                    player.currentTime = lastTime;
                } else {
                    lastTime = player.currentTime;
                }
            };

            player.onended = () => {
                const status = parentLi.querySelector('.status');
                status.textContent = ' Completed';
                parentLi.classList.add('completed');
                button.classList.add('completed');
                localStorage.setItem("watched_" + src, "true");

                const next = allLis[index + 1];
                if (next) {
                    next.classList.remove('locked');
                }


            };

        }

        window.onload = () => {
            const videos = document.querySelectorAll(".course-videos li");
            videos.forEach((item, index) => {
                const icon = item.querySelector(".play-icon");
                const src = icon.getAttribute("onclick").match(/'(.*?)'/)[1];
                const key = "watched_" + src;


            });

        };


    </script>
