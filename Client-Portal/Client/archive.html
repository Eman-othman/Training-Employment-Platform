    <script type="text/javascript">
        let menuToggle = document.querySelector('.toggle')
        let Navigation = document.querySelector('.navigation')
        menuToggle.onclick = function () {
            menuToggle.classList.toggle('active')
            Navigation.classList.toggle('active')
        }

        let list = document.querySelectorAll('.list');
        for (let i = 0; i < list.length; i++) {
            list[i].onclick = function () {
                let j = 0;
                while (j < list.length) {
                    list[j++].className = 'list'
                }
                list[i].className = 'list active'
            }
        }

    </script>
    <script type="text/javascript">

    </script>

    <section class="jobs-list-container">
        <h2>Archived Items</h2>

        <div class="jobs" style="margin-top: 30px;">

                <h3 class="job-title">Job name here</h3>

            <div class="job">
                <h3 class="job-title">Course name here</h3>
                <div class="details">Course details here</div>
                <div class="action-buttons" style="margin-top: 10px;">
                    <button class="details-btn restore-btn">Restore</button>
                    <button class="details-btn delete-btn" style="background-color: #7e2d2d; color: white;">
                        Delete</button>
                </div>
            </div>

        </div>
    </section>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script>
        document.querySelectorAll(".restore-btn").forEach(button => {
            button.addEventListener("click", function () {
                swal({
                    title: "Do you want to restore this item?"
                    ,
                    icon: "info",
                    buttons: ["cancel", "restore"],
                }).then(confirmed => {
                    if (confirmed) {
                        // ⚠️ هنا مستقبلاً يتم إرسال الطلب إلى باك PHP لاسترجاع العنصر من قاعدة البيانات
                        swal("restored", "The item was successfully restored."
                            , "success");
                    }
                });
            });
        });

        // حدث عند الضغط على زر "حذف نهائي"
        document.querySelectorAll(".delete-btn").forEach(button => {
            button.addEventListener("click", function () {
                swal({
                    title: "Are you sure?",
                    text: "This item will be permanently deleted from the database."
                    ,
                    icon: "warning",
                    buttons: ["Cancel", "Delete"],
                    dangerMode: true,
                }).then(confirmed => {
                    if (confirmed) {
                        // ⚠️ هنا مستقبلاً يتم إرسال الطلب إلى باك PHP لحذف العنصر نهائيًا
                        swal("Deleted", "The item has been permanently deleted."
                            , "success");
                    }
                });
            });
        });
    </script>
