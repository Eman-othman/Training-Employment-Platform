        <div class="company-item" id="company1" onclick="loadChat('company1')">

    </div>

    <!-- Chat Area -->
    <div class="chat-container">

        <div class="chat-header" id="chatHeader">
            <span id="chatTitle">Select a conversation to view details</span>
            <button id="deleteChatBtn" onclick="deleteChat()" title="Delete Chat">
                <i class="fas fa-trash-alt"></i>
            </button>

        </div>


        <div class="messages" id="messages"></div>
        <div class="chat-input" style="display: none;" id="chatInput">
            <textarea placeholder="Write your message here..." id="messageInput"></textarea>
            <button onclick="sendMessage()">send</button>
        </div>

    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script>
        let currentCompany = null;
        let currentType = null;
        const messagesData = {
            company1: [
                { sender: 'user', text: 'مرحباً، أنا مهتم بالفرصة التي تقدمونها.' },
                { sender: 'company', text: 'أهلاً بك، كيف يمكننا مساعدتك؟' }
            ],
            company2: [
                { sender: 'user', text: 'أريد معرفة المزيد عن الخدمات.' },
                { sender: 'company', text: 'نحن نقدم استشارات في العديد من المجالات.' }
            ],
            company3: [
                { sender: 'user', text: 'هل يمكنني الحصول على تفاصيل الوظيفة؟' },
                { sender: 'company', text: 'بالطبع، يرجى إرسال سيرتك الذاتية.' }
            ],


        };
        const tickets = [
            {
                id: "TK-001",
                subject: "Login problem",
                status: "open",
                date: "2025-05-04",
                messages: [
                    { sender: "user", text: "لا أستطيع تسجيل الدخول." },
                    { sender: "support", text: "هل جربت إعادة تعيين كلمة المرور؟" }
                ]
            },
            {
                id: "TK-002",
                subject: "Service inquiry",
                status: "closed",
                date: "2025-04-28",
                messages: [
                    { sender: "user", text: "ما هي الخدمات التي تقدمونها؟" },
                    { sender: "support", text: "نقدم استشارات ودعم فني." }
                ]
            }
        ];

        function loadChat(chatKey) {
            currentChat = chatKey;
            currentType = 'chat';

            const chatData = messagesData[chatKey] || [];

            document.getElementById('chatTitle').textContent = chatKey;
            document.getElementById('deleteChatBtn').style.visibility = 'visible';
            document.getElementById('chatInput').style.display = 'flex';

            document.querySelectorAll('.company-item').forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');

            displayMessages();
        }



        function loadTicket(index, event) {
            currentContext = index;
            currentType = 'ticket';

            const ticket = tickets[index];
            document.getElementById('chatTitle').innerHTML = `
        <div><strong>Ticket #${ticket.id}</strong> - ${ticket.subject}</div>
        <div class="ticket-status">${ticket.status === 'closed' ? '🔴 closed' : '🟢 open'} - ${ticket.date}</div>
    `;
            document.getElementById('chatInput').style.display = ticket.status === 'open' ? 'flex' : 'none';
            document.getElementById('deleteChatBtn').style.visibility = 'visible';

            // إزالة التفعيل من جميع العناصر
            document.querySelectorAll('.company-item').forEach(item => item.classList.remove('active'));

            // تفعيل العنصر الحالي
            if (event && event.target) {
                event.target.classList.add('active');
            }

            displayMessages(ticket.messages);
        }


        function displayMessages(messages = null) {
            const container = document.getElementById('messages');
            container.innerHTML = '';

            const chatMessages = messages || (currentType === 'ticket' ? tickets[currentContext].messages : messagesData[currentChat]);

            if (!chatMessages) return;

            chatMessages.forEach((message) => {
                const msg = document.createElement('div');
                msg.classList.add('message', message.sender === 'user' ? 'from-user' : (message.sender === 'support' ? 'from-support' : 'from-company'));

                const text = document.createElement('div');
                text.textContent = message.text;

                const timestamp = document.createElement('div');
                timestamp.className = 'timestamp';
                timestamp.textContent = new Date().toLocaleString('ar-EG');

                msg.appendChild(text);
                msg.appendChild(timestamp);
                container.appendChild(msg);
            });

            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (text === '') return;

            if (currentType === 'ticket') {
                const ticket = tickets[currentContext];
                if (ticket.status === 'open') {
                    ticket.messages.push({ sender: 'user', text });
                }
            } else if (currentChat) {
                messagesData[currentChat].push({ sender: 'user', text });
            }

            input.value = '';
            displayMessages();
        }


        function deleteChat() {
            if (currentType === 'ticket') {
                const ticket = tickets[currentContext];
                swal({
                    title: "Are you sure?",
                    text: `Ticket #${ticket.id} will be permanently deleted.`,
                    icon: "warning",
                    buttons: ["Cancel", "Delete"],
                    dangerMode: true,
                }).then((willDelete) => {
                    if (willDelete) {
                        // Remove the ticket from the array
                        tickets.splice(currentContext, 1);

                        // Remove from sidebar
                        const sidebarItems = document.querySelectorAll('.company-item');
                        sidebarItems.forEach((item, index) => {
                            if (item.textContent.includes(ticket.id)) {
                                item.remove();
                            }
                        });

                        // Reset UI
                        currentContext = null;
                        currentType = null;
                        document.getElementById('messages').innerHTML = '';
                        document.getElementById('chatTitle').textContent = 'Select a conversation to view details';
                        document.getElementById('chatInput').style.display = 'none';
                        document.getElementById('deleteChatBtn').style.visibility = 'hidden';

                        swal("Deleted!", "The ticket conversation has been deleted.", "success");
                    }
                });

            } else if (currentChat && currentType === 'chat') {
                swal({
                    title: "Are you sure?",
                    text: "This chat will be permanently deleted.",
                    icon: "warning",
                    buttons: ["Cancel", "Delete"],
                    dangerMode: true,
                }).then((willDelete) => {
                    if (willDelete) {
                        // Remove from messages data
                        delete messagesData[currentChat];

                        // Remove from sidebar
                        const chatElement = document.getElementById(currentChat);
                        if (chatElement) {
                            chatElement.remove();
                        }

                        // Clear UI
                        currentChat = null;
                        currentType = null;
                        document.getElementById('messages').innerHTML = '';
                        document.getElementById('chatTitle').textContent = 'Select a conversation to view details';
                        document.getElementById('chatInput').style.display = 'none';
                        document.getElementById('deleteChatBtn').style.visibility = 'hidden';

                        swal("Deleted!", "The chat has been deleted.", "success");
                    }
                });
            }
        }

    </script>
