<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="more-details.css" />

</head>

<body>

    <section class="jobs-list-container">
        <div class="jobs">
            <div class="job">
                <!-- <img src="" alt=""> -->
                <h5 class="job-title">Job name here</h5>
                <hr>

                <p class="job-title">Required qualifications</p>
                <div class="details">
                    Required qualifications here
                </div>
                <hr>
                <p class="job-title">location</p>
                <div class="details">
                    location here
                </div>
                <hr>

                <p class="job-title">Working hours and days</p>
                <div class="details">
                    Working hours and days here

                </div>
                <hr>



            </div>

        </div>
        <!-- <a href="/FrontEnd(jonior-pro)\contact.html" class="details-btn">Contact us</a> -->


        <button class="details-btn" onclick="openModal()">Contact us </button>

        <!-- نافذة المراسلة -->
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal">
                <span class="close-btn" onclick="closeModal()">×</span>
                <h3>Contact Us : <span id="companyName">Tech Solutions Inc.</span></h3>
                <!-- <p>Company:  -->
                <textarea rows="4" placeholder="Enter your message here..."></textarea>
                <button>Send</button>
            </div>
        </div>

        <script>
            function openModal() {
                document.getElementById('modalOverlay').style.display = 'flex';
            }

            function closeModal() {
                document.getElementById('modalOverlay').style.display = 'none';
            }

            //   اسم الشركة من الداتابيزـ :
            const companyFromDB = "company name ";
            document.getElementById("companyName").innerText = companyFromDB;
        </script>









        <a href="Jobs.html" class="details-btn">OK</a>
        </div>
    </section>
</body>

</html>
